<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · Saltar</title>
    <link rel="icon" href="/login/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Branding de la landing (apps/landing, diseño C · Amanecer). */
      :root {
        color-scheme: light;
        --navy: #262f63; --navy-deep: #1b2250; --ink-2: #545c86;
        --paper: #fbf8f2; --cream-2: #ece3d3; --line: #d9d0bf; --edge: #e6decf;
        --sun: #f2ae2e; --sun-ink: #94601a; --mist: #dde1f2; --lavender-soft: #c9cfe8;
        --no: #b5524a; --live: #2fbf71;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100svh; position: relative; overflow-x: hidden;
        display: flex; flex-direction: column; align-items: center;
        padding: 24px 16px 0;
        background: linear-gradient(180deg, #161c45 0%, #2b3470 45%, #8a7fa6 70%, #f3c98a 90%, #f6ddb0 100%);
        color: var(--navy); font: 15px/1.55 "Montserrat", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .escena { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .estrella { position: absolute; border-radius: 50%; background: #ffffffb3; animation: titila 4s ease-in-out infinite; }
      .brillo { position: absolute; left: 50%; bottom: -60px; width: 900px; height: 520px; transform: translateX(-50%); border-radius: 50%;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, #ffd98acc 0%, #ffd98a00 100%); }
      .sol { position: absolute; left: calc(50% - 160px); bottom: -40px; width: 320px; animation: sube 1.6s cubic-bezier(.2,.7,.2,1) both; }
      .andes { position: absolute; left: 50%; bottom: -140px; width: max(100%, 1440px); transform: translateX(-50%); animation: andes 1.4s cubic-bezier(.2,.7,.2,1) both; }

      header { position: relative; z-index: 2; width: 100%; max-width: 1248px; display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; font-size: 17px; }
      header img { width: 22px; height: 22px; }
      header .chip { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--mist); display: flex; align-items: center; gap: 6px; }
      header .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); }

      main { position: relative; z-index: 2; flex: 1; width: 100%; display: flex; align-items: flex-start; justify-content: center; padding: 9vh 0 260px; }
      .card {
        width: 100%; max-width: 440px; background: var(--paper); border: 1px solid var(--edge); border-radius: 20px;
        padding: 30px 28px 26px; box-shadow: 0 24px 60px #0d123866; animation: arriba .9s cubic-bezier(.2,.7,.2,1) .2s both;
      }
      .eyebrow { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--sun-ink); }
      h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.5px; color: var(--navy-deep); }
      p { margin: 8px 0; color: var(--ink-2); }
      b { color: var(--navy-deep); font-weight: 600; }
      .aviso { color: var(--no); }
      .nota { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--cream-2); color: var(--navy); }
      code { font: 12.5px/1.4 "JetBrains Mono", ui-monospace, monospace; word-break: break-all; color: var(--navy-deep); }
      button {
        width: 100%; margin-top: 18px; padding: 15px 20px; border: 0; border-radius: 999px; cursor: pointer;
        background: var(--sun); color: var(--navy-deep); font: 700 16px "Montserrat", system-ui, sans-serif;
        box-shadow: 0 10px 30px #f2ae2e59; transition: transform .15s ease;
      }
      button:hover:not(:disabled) { transform: translateY(-2px); }
      button:disabled { opacity: .6; cursor: default; box-shadow: none; }
      button.secundario { margin-top: 10px; background: transparent; color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; }
      footer { position: fixed; z-index: 2; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--navy-deep); opacity: .8; }

      @keyframes titila { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes sube { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes andes { from { transform: translate(-50%, 120px); } to { transform: translateX(-50%); } }
      @keyframes arriba { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (max-width: 640px) {
        main { padding-top: 5vh; padding-bottom: 200px; }
        .card { padding: 26px 22px 22px; }
        h1 { font-size: 21px; }
        .sol { width: 220px; left: calc(50% - 110px); bottom: -30px; }
        .andes { bottom: -226px; }
        .brillo { width: 640px; height: 400px; }
      }
      @media (prefers-reduced-motion: reduce) { .estrella, .sol, .andes, .card { animation: none; } }
    </style>
  </head>
  <body>
    <div class="escena" aria-hidden="true">
      <span class="estrella" style="left:12%;top:150px;width:3px;height:3px"></span>
      <span class="estrella" style="left:22%;top:90px;width:2px;height:2px;animation-delay:.4s"></span>
      <span class="estrella" style="left:86%;top:130px;width:3px;height:3px;animation-delay:.8s"></span>
      <span class="estrella" style="left:76%;top:220px;width:2px;height:2px;animation-delay:1.1s"></span>
      <span class="estrella" style="left:6%;top:330px;width:2px;height:2px;animation-delay:1.5s"></span>
      <span class="estrella" style="left:93%;top:300px;width:2px;height:2px;animation-delay:1.9s"></span>
      <div class="brillo"></div>
      <img class="sol" src="/login/sol-de-mayo.png" alt="" />
      <img class="andes" src="/login/andes.png" alt="" />
    </div>
    <header>
      <img src="/login/sol-de-mayo.png" alt="" />
      <span>Saltar</span>
      <span class="chip">Conexión segura con Privy</span>
    </header>
    <main>
      <div id="root" class="card"><p>Cargando…</p></div>
    </main>
    <footer>Proyecto de HackaTwin 2026, equipo Mixto C</footer>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
