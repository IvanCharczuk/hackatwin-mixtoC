<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · MCP Mixto C</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbf7f2; --fg: #1d1a16; --muted: #6b6259; --card: #ffffff; --line: #eadfd3; --accent: #e8743b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15120f; --fg: #f3ede6; --muted: #a89c90; --card: #1f1b17; --line: #3a322b; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
      .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 8px 0; color: var(--muted); }
      b { color: var(--fg); }
      button { width: 100%; margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      button.secundario { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .aviso { color: #c2410c; }
      code { font-size: 13px; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root" class="card"><p>Cargando…</p></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
